name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: matrimonial/package-lock.json

      - run: npm ci
        working-directory: matrimonial

      - name: Lint
        run: npm run lint
        working-directory: matrimonial

      - name: Type check
        run: npm run type-check
        working-directory: matrimonial

      - name: Tests
        run: npm run test
        working-directory: matrimonial

      - name: Build
        run: npm run build
        working-directory: matrimonial
        env:
          NEXT_PUBLIC_SITE_URL: https://haldimehendi.com
